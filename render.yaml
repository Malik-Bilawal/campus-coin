services:
  - type: web
    name: campus-coin-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_TIMEOUT_MS
        value: "45000"
      # Set after the Vercel production URL exists (CORS origin + reset links):
      - key: CLIENT_URL
        sync: false
      # Paste from server/.env (or generate fresh):
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      # Optional — AI chat/insights (works without them via rule fallbacks):
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Optional — OTP + password-reset emails (console fallback without them):
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
